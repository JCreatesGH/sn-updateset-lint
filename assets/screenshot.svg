  <text x="390" y="22" fill="#bac2de" font-size="12" text-anchor="middle">usetlint — change review</text>
  <text font-size="13" xml:space="preserve">
    <tspan x="18" y="64" fill="#a6e3a1">$ </tspan><tspan fill="#cdd6f4">usetlint promote_to_prod.xml</tspan>
    <tspan x="18" y="86" fill="#cdd6f4">3 changes, 4 findings</tspan>
    <tspan x="18" y="116" fill="#f38ba8">  [HIGH  ]</tspan><tspan fill="#cdd6f4"> acl-change: Security ACL modified — review read/write access.</tspan>
    <tspan x="18" y="134" fill="#6c7086">           (sys_security_acl_bbb222)</tspan>
    <tspan x="18" y="160" fill="#f38ba8">  [HIGH  ]</tspan><tspan fill="#cdd6f4"> global-business-rule: BR has no target table — runs broadly.</tspan>
    <tspan x="18" y="178" fill="#6c7086">           (sys_script_ccc333)</tspan>
    <tspan x="18" y="204" fill="#f38ba8">  [HIGH  ]</tspan><tspan fill="#cdd6f4"> dynamic-eval: Uses gs.eval — injection risk.</tspan>
    <tspan x="18" y="222" fill="#6c7086">           (sys_script_ccc333)</tspan>
    <tspan x="18" y="248" fill="#f9e2af">  [MEDIUM]</tspan><tspan fill="#cdd6f4"> hardcoded-reference: payload contains a hardcoded instance URL.</tspan>
    <tspan x="18" y="266" fill="#6c7086">           (sys_script_ccc333)</tspan>
    <tspan x="18" y="298" fill="#a6e3a1">$ </tspan><tspan fill="#cdd6f4">usetlint dev.xml prod.xml   </tspan><tspan fill="#6c7086"># diff two sets</tspan>
    <tspan x="18" y="320" fill="#89b4fa">added: 1</tspan><tspan fill="#cdd6f4">   sys_script_ddd444</tspan>
    <tspan x="18" y="338" fill="#f38ba8">removed: 1</tspan><tspan fill="#cdd6f4"> sys_security_acl_bbb222</tspan>
    <tspan x="18" y="356" fill="#f9e2af">changed: 1</tspan><tspan fill="#cdd6f4"> sys_script_aaa111</tspan>
    <tspan x="18" y="388" fill="#a6e3a1">✓ exits non-zero when HIGH findings exist → drop into CI</tspan>
    <tspan x="18" y="410" fill="#6c7086"># 6 tests · pure XML parsing · zero runtime dependencies</tspan>
